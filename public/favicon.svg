<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer Gold Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.6" />

  <!-- Quran Book Shape -->
  <g filter="url(#shadow)">
    <!-- Left Page -->
    <path d="M 256 140 C 210 120, 140 120, 96 140 L 96 360 C 140 340, 210 340, 256 360 Z" fill="#fffef0" />
    <!-- Right Page -->
    <path d="M 256 140 C 302 120, 372 120, 416 140 L 416 360 C 372 340, 302 340, 256 360 Z" fill="#fefce8" />
    
    <!-- Book Spine -->
    <line x1="256" y1="140" x2="256" y2="360" stroke="#d97706" stroke-width="4" stroke-linecap="round" />

    <!-- Islamic Star Motif (Rub el Hizb) -->
    <g transform="translate(256, 250) scale(1.6)" fill="url(#goldGrad)">
      <rect x="-15" y="-15" width="30" height="30" rx="3" />
      <rect x="-15" y="-15" width="30" height="30" rx="3" transform="rotate(45)" />
      <circle cx="0" cy="0" r="8" fill="#064e3b" />
      <circle cx="0" cy="0" r="4" fill="#fbbf24" />
    </g>

    <!-- Page Lines -->
    <path d="M 128 180 Q 180 170 230 180 M 128 210 Q 180 200 230 210 M 128 300 Q 180 290 230 300" stroke="#059669" stroke-width="3" stroke-linecap="round" opacity="0.3" fill="none" />
    <path d="M 384 180 Q 332 170 282 180 M 384 210 Q 332 200 282 210 M 384 300 Q 332 290 282 300" stroke="#059669" stroke-width="3" stroke-linecap="round" opacity="0.3" fill="none" />
  </g>
</svg>
